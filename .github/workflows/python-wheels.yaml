name: Build Python Wheels

# Build wheels on release branches, when requested, or from the release workflow.
on:
  workflow_call:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to force on wheels"
        required: false
        type: string
        default: ""
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/python-wheels.yaml'
  push:
    branches:
      - main
      - 'maint-**'

permissions:
  contents: read

jobs:
  sdist:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.ref }}
        fetch-depth: 0
        fetch-tags: true
        persist-credentials: false

    - uses: actions/setup-python@v7
      with:
        python-version: '3.14'

    - name: Install packaging tools
      run: |
        pip install build twine

    - name: Verify checked-out tag
      if: github.ref_type == 'tag'
      run: |
        actual_tag="$(git describe --exact-match --tags --match='geoarrow-c-python-*')"
        if [[ "$actual_tag" != "$GITHUB_REF_NAME" ]]; then
          echo "::error::HEAD is tagged as $actual_tag, expected $GITHUB_REF_NAME"
          exit 1
        fi

    - name: Build sdist
      run: |
        cd python/geoarrow-c
        python -m build --sdist
        pwd && ls -lh dist

    - name: Check install from sdist
      run: |
        pip install python/geoarrow-c/dist/geoarrow_c-*.tar.gz

    - name: Test import
      run: |
        python -c "import geoarrow.c; print(geoarrow.c.__version__)"

    - name: Run twine check
      run: |
        twine check --strict python/geoarrow-c/dist/geoarrow_c-*.tar.gz

    - uses: actions/upload-artifact@v7
      with:
        name: release-sdist
        path: ./python/geoarrow-c/dist/geoarrow_c-*.tar.gz
        if-no-files-found: error

  wheels:
    needs: ["sdist"]
    name: ${{ matrix.config.label }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: "ubuntu-latest", label: "pyodide", platform: "pyodide", arch: "auto", legacy_build: "cp312-*"}
          - {os: "ubuntu-latest", label: "linux", platform: "auto", arch: "auto", legacy_build: "cp313t-*"}
          - {os: "windows-latest", label: "windows-x86", platform: "auto", arch: "x86", legacy_build: "cp313t-*" }
          - {os: "windows-latest", label: "windows-amd64", platform: "auto", arch: "AMD64", legacy_build: "cp313t-*" }
          - {os: "windows-latest", label: "windows-arm64", platform: "auto", arch: "ARM64", legacy_build: "cp313t-*" }
          - {os: "macOS-15-intel", label: "macOS", platform: "auto", arch: "auto", legacy_build: "cp313t-*"}
          - {os: "macOS-latest", label: "macOS-arm64", platform: "auto", arch: "auto", legacy_build: "cp313t-*"}
          - {os: "ubuntu-24.04-arm", label: "linux-arm64", platform: "auto", arch: "auto", legacy_build: "cp313t-*"}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==4.2.1

      - name: Verify checked-out tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          actual_tag="$(git describe --exact-match --tags --match='geoarrow-c-python-*')"
          if [[ "$actual_tag" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::HEAD is tagged as $actual_tag, expected $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Build wheels
        run: |
          python -m cibuildwheel --output-dir wheelhouse python/geoarrow-c
        env:
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: pytest {package}/tests -vv
          CIBW_PLATFORM: ${{ matrix.config.platform }}
          CIBW_ARCHS: ${{ matrix.config.arch }}
          CIBW_SKIP: pp*
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: ""

      - uses: actions/upload-artifact@v7
        with:
          name: release-wheels-${{ matrix.config.label }}
          path: ./wheelhouse/*.whl
          if-no-files-found: error
