name: release

on:
  push:
    tags:
      - 'geoarrow-c-python-*'

permissions:
  contents: read

jobs:
  select-package:
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.tag.outputs.version }}

    steps:
      - name: Validate release tag
        id: tag
        shell: bash
        run: |
          tag="$GITHUB_REF_NAME"

          if [[ ! "$tag" =~ ^geoarrow-c-python-([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::Invalid release tag: $tag"
            exit 1
          fi

          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"

  build:
    needs: select-package
    uses: ./.github/workflows/python-wheels.yaml
    permissions:
      contents: read

  verify-release:
    needs: ["select-package", "build"]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist/
          merge-multiple: true

      - name: Install packaging tools
        run: python -m pip install --upgrade twine

      - name: Verify distribution metadata
        env:
          EXPECTED_PACKAGE: geoarrow-c
          EXPECTED_VERSION: ${{ needs.select-package.outputs.version }}
        run: |
          python - <<'PY'
          import email
          import os
          import tarfile
          from pathlib import Path
          from zipfile import ZipFile

          distributions = [
              path for path in Path("dist").iterdir()
              if path.suffix == ".whl" or path.name.endswith(".tar.gz")
          ]
          if not distributions:
              raise RuntimeError("No distributions found")

          expected = (os.environ["EXPECTED_PACKAGE"], os.environ["EXPECTED_VERSION"])
          for distribution in distributions:
              if distribution.suffix == ".whl":
                  with ZipFile(distribution) as archive:
                      metadata_paths = [
                          path for path in archive.namelist()
                          if path.endswith(".dist-info/METADATA")
                      ]
                      if len(metadata_paths) != 1:
                          raise RuntimeError(
                              f"Expected one METADATA file in {distribution}, "
                              f"found: {metadata_paths}"
                          )
                      metadata = email.message_from_bytes(
                          archive.read(metadata_paths[0])
                      )
              else:
                  with tarfile.open(distribution, "r:gz") as archive:
                      metadata_members = [
                          member for member in archive.getmembers()
                          if member.name.endswith("/PKG-INFO")
                          and member.name.count("/") == 1
                      ]
                      if len(metadata_members) != 1:
                          raise RuntimeError(
                              f"Expected one PKG-INFO file in {distribution}, "
                              f"found: {[member.name for member in metadata_members]}"
                          )
                      metadata_file = archive.extractfile(metadata_members[0])
                      if metadata_file is None:
                          raise RuntimeError(
                              f"Could not read metadata from {distribution}"
                          )
                      metadata = email.message_from_bytes(metadata_file.read())

              actual = (metadata["Name"], metadata["Version"])
              if actual != expected:
                  raise RuntimeError(
                      f"Built {actual} in {distribution}, expected {expected}"
                  )
          PY

      - name: Check distributions
        run: python -m twine check --strict dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: ["select-package", "verify-release"]
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/geoarrow-c

    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
